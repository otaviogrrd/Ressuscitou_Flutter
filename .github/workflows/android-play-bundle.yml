name: Android App Bundle for Play Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode maior que TODOS os APKs/AABs já enviados à Play Console"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate version code
        env:
          PLAY_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          code = os.environ["PLAY_BUILD_NUMBER"]
          if not code.isascii() or not code.isdecimal() or not 4029 <= int(code) <= 2100000000:
              raise SystemExit("Informe um versionCode inteiro entre 4029 e 2100000000, acima do maior usado na Play Console.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          flutter pub get
          (cd plugins/flutter_speed_dial && flutter pub get)
      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos lib test
          flutter test
      - name: Restore upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD", "ANDROID_STORE_PASSWORD")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Cadastre os GitHub Actions secrets: " + ", ".join(missing))

          def escape(value):
              result = ""
              for char in value:
                  if char in "\\ :=#!":
                      result += "\\" + char
                  elif char in "\n\r\t":
                      result += {"\n": "\\n", "\r": "\\r", "\t": "\\t"}[char]
                  elif ord(char) > 126:
                      encoded = char.encode("utf-16-be")
                      result += "".join("\\u" + encoded[i:i+2].hex() for i in range(0, len(encoded), 2))
                  else:
                      result += char
              return result

          key = Path(os.environ["RUNNER_TEMP"]) / "ressuscitou-upload.jks"
          key.write_bytes(base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True))
          key.chmod(0o600)
          values = {
              "storeFile": str(key),
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
          }
          properties = Path("android/key.properties")
          properties.write_text("".join(k + "=" + escape(v) + "\n" for k, v in values.items()), encoding="ascii")
          properties.chmod(0o600)
          PY
      - name: Build signed App Bundle
        env:
          PLAY_BUILD_NUMBER: ${{ inputs.build_number }}
          SEARCH_API_URL: ${{ vars.SEARCH_API_URL }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-number="$PLAY_BUILD_NUMBER" \
            --dart-define=SEARCH_API_URL="${SEARCH_API_URL:-}"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          mkdir -p play-validation
          cp build/app/outputs/mapping/release/mapping.txt play-validation/
          python3 tools/check_android_native_alignment.py build/app/outputs/bundle/release/app-release.aab | tee play-validation/native-alignment.txt
          find build/app/intermediates -path '*release*' -name AndroidManifest.xml -exec cp {} play-validation/ \;
      - name: Record Android release dependencies
        run: |
          set -euo pipefail
          mkdir -p play-validation
          (cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath) > play-validation/android-dependencies.txt
      - name: Save signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ressuscitou-play-aab-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Save Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ressuscitou-play-validation-${{ inputs.build_number }}
          path: play-validation/
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/ressuscitou-upload.jks"
